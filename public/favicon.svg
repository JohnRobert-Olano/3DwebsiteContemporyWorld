<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Outer Glow/Atmosphere -->
  <circle cx="24" cy="24" r="23" fill="none" stroke="#4daaff" stroke-width="1" opacity="0.3"/>
  
  <!-- Base Ocean Circle -->
  <circle cx="24" cy="24" r="22" fill="#07315c"/>
  
  <!-- Ocean Gradient -->
  <circle cx="24" cy="24" r="22" fill="url(#oceanGrad)"/>
  
  <!-- Continents/Landmasses -->
  <g fill="#7ad0ff" opacity="0.85">
    <!-- North/South America -->
    <path d="M12,14 C10,15 9,17 9,19 C9,22 13,22 12,25 C11,27 10,29 12,32 C13,34 15,36 15,39 C15,40 16,41 17,40 C18,39 18,36 17,34 C16,32 17,30 18,29 C19,28 20,24 19,23 C18,22 17,21 16,19 C15,17 14,14 12,14 Z" fill="url(#landGrad)"/>
    <!-- Europe / Africa -->
    <path d="M28,12 C26,13 25,15 26,17 C27,19 31,18 31,21 C31,23 29,25 28,27 C27,29 27,33 29,36 C30,38 32,39 34,39 C36,39 37,35 36,33 C35,31 34,29 35,27 C36,25 38,23 37,20 C36,17 32,15 28,12 Z" fill="url(#landGrad)"/>
    <!-- Asia / Australia -->
    <path d="M38,15 C37,17 39,18 41,18 C43,18 44,16 43,19 C42,22 39,21 38,23 C37,25 39,27 41,27 C42,27 43,29 42,31 C41,33 39,32 38,34 C37,36 39,38 41,38 C42,38 43,36 44,35 C45,34 46,31 45,28 C44,25 46,22 45,19 C44,16 41,14 38,15 Z" fill="url(#landGrad)"/>
  </g>

  <!-- Grid Lines (Grid of the Globe) -->
  <g stroke="#ffffff" stroke-width="0.75" fill="none" opacity="0.2">
    <!-- Equator -->
    <line x1="2" y1="24" x2="46" y2="24"/>
    <!-- Latitudes -->
    <path d="M5.1,14 C13,18 35,18 42.9,14"/>
    <path d="M5.1,34 C13,30 35,30 42.9,34"/>
    <!-- Longitudes -->
    <path d="M24,2 A22,22 0 0,0 24,46"/>
    <path d="M24,2 A22,22 0 0,1 24,46"/>
    <!-- Outline circle of grid -->
    <circle cx="24" cy="24" r="22"/>
  </g>
  
  <!-- Spherical shadow overlay for 3D globe effect -->
  <circle cx="24" cy="24" r="22" fill="url(#sphereShade)" pointer-events="none"/>

  <defs>
    <!-- Ocean gradient: deep navy blue to cyan-blue -->
    <radialGradient id="oceanGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1c6cb4"/>
      <stop offset="60%" stop-color="#07315c"/>
      <stop offset="100%" stop-color="#02172e"/>
    </radialGradient>
    
    <!-- Land/Continent gradient: bright teal to green-blue -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e2ff"/>
      <stop offset="50%" stop-color="#4daaff"/>
      <stop offset="100%" stop-color="#1e8fe8"/>
    </linearGradient>
    
    <!-- Spherical lighting shade -->
    <radialGradient id="sphereShade" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
  </defs>
</svg>